[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zei-payment"
version = "0.1.0"
description = "ZEI-Payment runtime for ZEI Gate"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["zei-forcesubs==0.1.0", "aiohttp==3.14.5", "qrcode[pil]>=8,<9"]

[tool.setuptools.packages.find]
include = ["zei_payment*"]
