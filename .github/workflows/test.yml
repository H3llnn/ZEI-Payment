name: Runtime integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: H3llnn/ZEI-Gate
          path: ZEI-Gate
      - uses: actions/checkout@v4
        with:
          repository: H3llnn/ZEI-ForceSubs
          path: ZEI-ForceSubs
      - uses: actions/checkout@v4
        with:
          path: ZEI-Payment
      - uses: actions/checkout@v4
        with:
          repository: H3llnn/ZEI-Userbot
          path: ZEI-Userbot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ZEI-Gate/requirements.txt ./ZEI-Userbot ./ZEI-ForceSubs ./ZEI-Payment
      - run: python -m unittest discover -s tests -v
        working-directory: ZEI-Gate
